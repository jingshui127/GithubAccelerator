<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.3"/>
  
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#grad1)" stroke-width="1" opacity="0.2"/>
  
  <g transform="translate(64, 64)">
    <circle cx="-20" cy="-20" r="8" fill="#3B82F6" filter="url(#glow)"/>
    <circle cx="20" cy="-20" r="8" fill="#10B981" filter="url(#glow)"/>
    <circle cx="-20" cy="20" r="8" fill="#F59E0B" filter="url(#glow)"/>
    <circle cx="20" cy="20" r="8" fill="#8B5CF6" filter="url(#glow)"/>
    
    <circle cx="0" cy="0" r="16" fill="url(#grad1)" filter="url(#glow)"/>
    
    <line x1="-20" y1="-20" x2="0" y2="0" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="-20" x2="0" y2="0" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round"/>
    <line x1="-20" y1="20" x2="0" y2="0" stroke="#FCD34D" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="0" y2="0" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round"/>
    
    <line x1="-20" y1="-20" x2="20" y2="-20" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="-20" y1="20" x2="20" y2="20" stroke="#C4B5FD" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="-20" y1="-20" x2="-20" y2="20" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="20" y1="-20" x2="20" y2="20" stroke="#6EE7B7" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    
    <circle cx="0" cy="0" r="6" fill="white"/>
  </g>
  
  <text x="64" y="110" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#374151" text-anchor="middle">科控物联</text>
</svg>